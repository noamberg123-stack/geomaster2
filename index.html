<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GEO IMAGE FIXED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#05070a;color:#fff;}
#top{height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 15px;background:#111;border-bottom:2px solid #0ff;}
#game{display:grid;grid-template-columns:1fr 0.35fr;height:calc(100vh - 60px);}
#sat,#map{height:100%;width:100%;}
#view{position:absolute;bottom:10px;left:10px;right:10px;height:180px;border:2px solid #0ff;overflow:hidden;}
#view img{width:100%;height:100%;object-fit:cover;}
#mapWrap{position:relative;}
</style>
</head>

<body>

<div id="top">
<div id="title">🌍 GEO IMAGE FIXED</div>
<div id="stats">Score: 0 | Round: 0 | Location: Loading...</div>
</div>

<div id="game">
<div id="sat"></div>
<div id="mapWrap">
<div id="map"></div>
<div id="view">Loading...</div>
</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let sat,map;
let target;
let score=0;
let round=0;
let country="Loading...";

const LOCS=[
{lat:48.85,lng:2.35},
{lat:40.71,lng:-74},
{lat:35.68,lng:139.69},
{lat:31.77,lng:35.21},
{lat:-33.86,lng:151.21},
{lat:25.20,lng:55.27}
];

// 🟢 יציב יותר מ-window.onload
document.addEventListener("DOMContentLoaded",init);

function init(){

sat=L.map("sat").setView([20,0],2);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}")
.addTo(sat);

map=L.map("map").setView([20,0],2);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

map.on("click",guess);

newRound();
}

function newRound(){
round++;

target=LOCS[Math.floor(Math.random()*LOCS.length)];

sat.setView([target.lat,target.lng],3);

// 📸 תמיד תמונה עובדת (ללא תלות ב-unsplash fail)
const url=`https://picsum.photos/seed/${target.lat+target.lng}/800/400`;

document.getElementById("view").innerHTML=
`<img src="${url}"/>`;

updateTop("...");
fetchCountry(target.lat,target.lng);
}

async function fetchCountry(lat,lng){

try{
const res=await fetch(
`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
);

const data=await res.json();

// 🛡️ בטוח יותר ממה שהיה
country=data?.address?.country || "Unknown";

}catch(e){
country="Unknown";
}

updateTop(country);
}

function updateTop(c){
document.getElementById("stats").innerText=
`Score: ${score} | Round: ${round} | Location: ${c}`;
}

function guess(e){

const d=distance(e.latlng.lat,e.latlng.lng,target.lat,target.lng);
const pts=Math.max(0,Math.round(10000-d*10));
score+=pts;

alert(`Distance: ${Math.round(d)} km\nPoints: ${pts}`);

newRound();
}

function distance(a,b,c,d){
const R=6371;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRO GEO DIVINE MODE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial;
background:#000;
color:white;
}

#top{
height:55px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
background:#111;
border-bottom:2px solid #0ff;
}

#image{
position:absolute;
inset:0;
background:#000;
}

#image img{
width:100%;
height:100%;
object-fit:cover;
opacity:0;
animation:fade 0.5s forwards;
}

@keyframes fade{
to{opacity:1;}
}

#map{
position:absolute;
bottom:10px;
right:10px;
width:340px;
height:230px;
border:2px solid #0ff;
z-index:10;
}

#result{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:15px;
border:2px solid #0ff;
display:none;
text-align:center;
z-index:20;
width:300px;
}

button{
background:#0ff;
border:none;
padding:6px;
margin-top:6px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div id="top">
<div>🌍 PRO GEO DIVINE MODE</div>
<div id="stats">Loading...</div>
</div>

<div id="image">Loading...</div>

<div id="map"></div>

<div id="result">
<div id="info"></div>
<button onclick="next()">NEXT</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map,marker,target;
let score=0,round=0;

const LOCS=[
{lat:48.85,lng:2.35,name:"Paris"},
{lat:40.71,lng:-74,name:"New York"},
{lat:35.68,lng:139.69,name:"Tokyo"},
{lat:31.77,lng:35.21,name:"Jerusalem"},
{lat:-33.86,lng:151.21,name:"Sydney"},
{lat:25.20,lng:55.27,name:"Dubai"}
];

document.addEventListener("DOMContentLoaded",()=>{

map=L.map("map").setView([20,0],2);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

map.on("click",guess);

newRound();
});

function newRound(){

round++;

target=LOCS[Math.floor(Math.random()*LOCS.length)];

loadImage(target.name);

updateTop("???");
}

function loadImage(name){

const img=new Image();

img.onload=()=>{
document.getElementById("image").innerHTML="";
document.getElementById("image").appendChild(img);
};

img.onerror=()=>{
img.src=`https://source.unsplash.com/1600x900/?street,city`;
};

img.src=`https://source.unsplash.com/1600x900/?street,city,cars,${name}`;
}

function guess(e){

if(marker) map.removeLayer(marker);

marker=L.marker([e.latlng.lat,e.latlng.lng]).addTo(map);

let d=distance(e.latlng.lat,e.latlng.lng,target.lat,target.lng);
let pts=Math.max(0,Math.round(10000-d*10));
score+=pts;

// heat system
let heat="🔵 COLD";
if(d<50) heat="⚡ DIVINE";
else if(d<200) heat="🔴 HOT";
else if(d<1000) heat="🟡 WARM";

if(window.line) map.removeLayer(window.line);

window.line=L.polyline([
[e.latlng.lat,e.latlng.lng],
[target.lat,target.lng]
],{color:"#0ff"}).addTo(map);

map.fitBounds([
[e.latlng.lat,e.latlng.lng],
[target.lat,target.lng]
]);

document.getElementById("result").style.display="block";

document.getElementById("info").innerHTML=
`<h3>${target.name}</h3>
<p>${heat}</p>
<p>Distance: ${Math.round(d)} km</p>
<p>Score: ${pts}</p>`;

updateTop(target.name);
}

function next(){

document.getElementById("result").style.display="none";

if(marker) map.removeLayer(marker);
if(window.line) map.removeLayer(window.line);

newRound();
}

function distance(a,b,c,d){
const R=6371;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function updateTop(loc){
document.getElementById("stats").innerText=
`Score: ${score} | Round: ${round} | Location: ${loc}`;
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRO GEO DUAL MAP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial;
background:#000;
color:white;
}

#top{
height:55px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
background:#111;
border-bottom:2px solid #0ff;
}

#game{
position:relative;
height:calc(100vh - 55px);
}

#image{
position:absolute;
inset:0;
}

#image img{
width:100%;
height:100%;
object-fit:cover;
}

/* 🟢 MINI GUESS MAP */
#guessMap{
position:absolute;
bottom:10px;
right:10px;
width:300px;
height:200px;
border:2px solid #0ff;
z-index:10;
}

/* 🔵 RESULT MAP */
#resultMapWrap{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:80%;
height:70%;
background:#111;
border:2px solid #0ff;
display:none;
z-index:20;
}

#resultMap{
width:100%;
height:100%;
}

#result{
position:absolute;
top:10px;
left:10px;
background:#111;
padding:10px;
border:1px solid #0ff;
z-index:21;
}

button{
background:#0ff;
border:none;
padding:6px;
margin-top:6px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div id="top">
<div>🌍 PRO GEO DUAL MAP</div>
<div id="stats">Loading...</div>
</div>

<div id="game">

<div id="image">Loading...</div>

<!-- 🟢 MAP FOR GUESS -->
<div id="guessMap"></div>

<!-- 🔵 RESULT MAP -->
<div id="resultMapWrap">
<div id="result"></div>
<div id="resultMap"></div>
<button onclick="next()">NEXT</button>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let guessMap,resultMap;
let target;
let marker;
let score=0;
let round=0;

const LOCS=[
{lat:48.85,lng:2.35,name:"Paris"},
{lat:40.71,lng:-74,name:"New York"},
{lat:35.68,lng:139.69,name:"Tokyo"},
{lat:31.77,lng:35.21,name:"Jerusalem"},
{lat:-33.86,lng:151.21,name:"Sydney"},
{lat:25.20,lng:55.27,name:"Dubai"}
];

document.addEventListener("DOMContentLoaded",()=>{

// 🟢 guess map (always visible)
guessMap=L.map("guessMap").setView([20,0],2);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(guessMap);

guessMap.on("click",guess);

newRound();
});

function newRound(){

round++;

target=LOCS[Math.floor(Math.random()*LOCS.length)];

// image
document.getElementById("image").innerHTML=
`<img src="https://source.unsplash.com/1600x900/?street,city,${target.name}"/>`;

updateTop("???");

if(resultMap){
resultMap.remove();
resultMap=null;
}
}

function guess(e){

if(marker) guessMap.removeLayer(marker);

marker=L.marker([e.latlng.lat,e.latlng.lng]).addTo(guessMap);

let d=distance(e.latlng.lat,e.latlng.lng,target.lat,target.lng);
let pts=Math.max(0,Math.round(10000-d*10));
score+=pts;

// 🔵 show result map
document.getElementById("resultMapWrap").style.display="block";
document.getElementById("result").innerHTML=
`<h3>${target.name}</h3>
<p>Distance: ${Math.round(d)} km</p>
<p>Points: ${pts}</p>`;

// init result map
resultMap=L.map("resultMap").setView([target.lat,target.lng],3);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(resultMap);

L.marker([target.lat,target.lng]).addTo(resultMap);
L.marker([e.latlng.lat,e.latlng.lng]).addTo(resultMap);

updateTop(target.name);
}

function next(){

document.getElementById("resultMapWrap").style.display="none";

if(resultMap){
resultMap.remove();
resultMap=null;
}

newRound();
}

function distance(a,b,c,d){
const R=6371;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function updateTop(loc){
document.getElementById("stats").innerText=
`Score: ${score} | Round: ${round} | Location: ${loc}`;
}

</script>

</body>
</html>

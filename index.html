<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GEO PRO IMAGE FIX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
width:100%;
overflow:hidden;
font-family:Arial;
background:#05070a;
color:white;
}

#top{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
background:linear-gradient(90deg,#050,#011);
border-bottom:2px solid #0ff;
}

#title{color:#0ff;font-weight:bold;}
#stats{font-size:14px;}

#game{
display:grid;
grid-template-columns:1fr 0.35fr;
height:calc(100vh - 60px);
}

#sat,#map{
height:100%;
width:100%;
}

#streetView{
position:absolute;
bottom:10px;
left:10px;
right:10px;
height:180px;
border:2px solid #0ff;
overflow:hidden;
}

#streetView img{
width:100%;
height:100%;
object-fit:cover;
}

#mapWrap{position:relative;}
</style>
</head>

<body>

<div id="top">
<div id="title">🌍 GEO PRO IMAGE FIX</div>
<div id="stats">Score: 0 | Round: 0 | Mode: IMAGE</div>
</div>

<div id="game">
<div id="sat"></div>

<div id="mapWrap">
<div id="map"></div>
<div id="streetView">Loading...</div>
</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map,sat;
let target;
let score=0,round=0;
let country="Unknown";

const LOCS=[
{lat:48.85,lng:2.35},
{lat:40.71,lng:-74},
{lat:35.68,lng:139.69},
{lat:31.77,lng:35.21},
{lat:-33.86,lng:151.21},
{lat:25.20,lng:55.27}
];

// ✅ חשוב: מחכים שהדף והספריות באמת מוכנים
window.onload=function(){

if(!window.L){
alert("Leaflet failed to load");
return;
}

// MAP
sat=L.map("sat").setView([20,0],2);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}")
.addTo(sat);

map=L.map("map").setView([20,0],2);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png")
.addTo(map);

map.on("click",guess);

newRound();
};

function newRound(){
round++;

target=LOCS[Math.floor(Math.random()*LOCS.length)];
sat.setView([target.lat,target.lng],3);

updateImage();
updateTop("Unknown");
}

function guess(e){

let d=distance(e.latlng.lat,e.latlng.lng,target.lat,target.lng);
let pts=Math.max(0,10000-d*10);
score+=pts;

// reverse hint
fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${target.lat}&lon=${target.lng}`)
.then(r=>r.json())
.then(data=>{
country=data.address?.country || "Unknown";

updateTop(country);
});

document.getElementById("streetView").innerHTML=
`<img src="https://source.unsplash.com/800x400/?street,city,cars,${country}"/>`;

alert("Distance: "+Math.round(d)+" km\nPoints: "+pts);

newRound();
}

function updateImage(){
document.getElementById("streetView").innerHTML=
`<img src="https://source.unsplash.com/800x400/?street,city,cars"/>`;
}

function updateTop(c){
document.getElementById("stats").innerText=
`Score: ${score} | Round: ${round} | Location: ${c}`;
}

function distance(a,b,c,d){
const R=6371;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

</script>

</body>
</html>

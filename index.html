<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geo Ultra Satellite</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

#topbar{
    height:70px;
    background:#111;
    border-bottom:2px solid #222;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 20px;
}

.logo{
    color:#00ffcc;
    font-size:28px;
    font-weight:bold;
}

.stats{
    display:flex;
    gap:20px;
}

.stat{
    color:#aaa;
}

.value{
    color:white;
    font-weight:bold;
}

#game{
    display:flex;
    height:calc(100vh - 70px);
}

#satellite{
    flex:1;
}

#map{
    width:35%;
    min-width:350px;
    height:100%;
}

#overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.95);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:9999;
}

.title{
    font-size:72px;
    color:#00ffcc;
    margin-bottom:20px;
}

.subtitle{
    color:#777;
    margin-bottom:40px;
}

.play-btn{
    background:#00ffcc;
    color:black;

    border:none;

    padding:18px 40px;

    border-radius:15px;

    cursor:pointer;

    font-size:22px;
    font-weight:bold;
}

#result{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:#111;

    border:2px solid #00ffcc;

    padding:30px;

    border-radius:20px;

    display:none;

    z-index:99999;

    text-align:center;
}

.next-btn{
    margin-top:20px;

    background:#00ffcc;

    color:black;

    border:none;

    padding:12px 25px;

    border-radius:10px;

    cursor:pointer;
}

#timerBar{
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:6px;

    background:#00ffcc;

    z-index:999;
}

#comboEffect{
    position:absolute;

    top:90px;
    left:50%;

    transform:translateX(-50%);

    color:gold;

    font-size:42px;

    opacity:0;

    transition:0.3s;

    z-index:99999;
}

@media(max-width:900px){

    #game{
        flex-direction:column;
    }

    #map{
        width:100%;
        height:40%;
    }

    #satellite{
        height:60%;
    }

}

</style>
</head>

<body>

<div id="overlay">

    <div class="title">
        GEO ULTRA
    </div>

    <div class="subtitle">
        Satellite Challenge
    </div>

    <button class="play-btn"
    onclick="startGame()">

        START

    </button>

</div>

<div id="comboEffect"></div>

<div id="topbar">

    <div class="logo">
        🌍 GEO ULTRA
    </div>

    <div class="stats">

        <div class="stat">
            Score:
            <span class="value"
            id="score">0</span>
        </div>

        <div class="stat">
            Round:
            <span class="value"
            id="round">1</span>
        </div>

        <div class="stat">
            Combo:
            <span class="value"
            id="combo">x1</span>
        </div>

        <div class="stat">
            Time:
            <span class="value"
            id="timer">30</span>
        </div>

    </div>

</div>

<div id="game">

    <div id="satellite">

        <div id="timerBar"></div>

    </div>

    <div id="map"></div>

</div>

<div id="result">

    <h2>ROUND COMPLETE</h2>

    <p id="distanceText"></p>

    <p id="pointsText"></p>

    <button class="next-btn"
    onclick="nextRound()">

        NEXT ROUND

    </button>

</div>

<script>

const LOCATIONS = [

{
name:"New York",
lat:40.6892,
lon:-74.0445
},

{
name:"Paris",
lat:48.8584,
lon:2.2945
},

{
name:"Tokyo",
lat:35.6762,
lon:139.6503
},

{
name:"Sydney",
lat:-33.8568,
lon:151.2153
},

{
name:"Dubai",
lat:25.1972,
lon:55.2744
},

{
name:"Rome",
lat:41.8902,
lon:12.4922
}

];

let map;
let satellite;
let target;

let score = 0;
let round = 1;
let combo = 0;

let canGuess = true;

let timer;
let timeLeft = 30;

const scoreEl =
document.getElementById("score");

const roundEl =
document.getElementById("round");

const comboEl =
document.getElementById("combo");

const timerEl =
document.getElementById("timer");

function startGame(){

    document.getElementById("overlay")
    .style.display = "none";

    satellite =
    L.map('satellite',
    {
        zoomControl:false
    })
    .setView([20,0],2);

    L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
    ).addTo(satellite);

    map =
    L.map('map')
    .setView([20,0],2);

    L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
    ).addTo(map);

    map.on('click',handleGuess);

    nextRound();
}

function nextRound(){

    document.getElementById("result")
    .style.display = "none";

    canGuess = true;

    target =
    LOCATIONS[
        Math.floor(Math.random()*LOCATIONS.length)
    ];

    satellite.setView(
        [target.lat,target.lon],
        15
    );

    resetTimer();
}

function resetTimer(){

    clearInterval(timer);

    timeLeft = 30;

    timerEl.innerText = timeLeft;

    const bar =
    document.getElementById("timerBar");

    bar.style.width = "100%";

    timer =
    setInterval(()=>{

        timeLeft--;

        timerEl.innerText = timeLeft;

        bar.style.width =
        (timeLeft/30)*100 + "%";

        if(timeLeft <= 0){

            clearInterval(timer);

            canGuess = false;

            showResult(20000,0);
        }

    },1000);
}

function distance(
lat1,
lon1,
lat2,
lon2
){

    const R = 6371;

    const dLat =
    (lat2-lat1)*Math.PI/180;

    const dLon =
    (lon2-lon1)*Math.PI/180;

    const a =

    Math.sin(dLat/2)*
    Math.sin(dLat/2)

    +

    Math.cos(lat1*Math.PI/180)

    *

    Math.cos(lat2*Math.PI/180)

    *

    Math.sin(dLon/2)

    *

    Math.sin(dLon/2);

    return R * 2 *

    Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );
}

function handleGuess(e){

    if(!canGuess) return;

    canGuess = false;

    clearInterval(timer);

    const d = distance(
        e.latlng.lat,
        e.latlng.lng,
        target.lat,
        target.lon
    );

    const marker1 =
    L.marker(e.latlng)
    .addTo(map);

    const marker2 =
    L.marker(
        [target.lat,target.lon]
    )
    .addTo(map);

    const line =
    L.polyline(
    [
        e.latlng,
        [target.lat,target.lon]
    ],
    {
        color:'#00ffcc'
    })
    .addTo(map);

    if(d < 500){

        combo++;

    }else{

        combo = 0;
    }

    const multiplier =
    1 + combo*0.5;

    comboEl.innerText =
    "x" +
    multiplier.toFixed(1);

    if(combo >= 2){

        showCombo(multiplier);
    }

    const points =
    Math.max(
        0,
        Math.round(
            (10000 - d*5)
            *
            multiplier
        )
    );

    score += points;

    scoreEl.innerText = score;

    round++;

    roundEl.innerText = round;

    showResult(d,points);

    setTimeout(()=>{

        map.removeLayer(marker1);

        map.removeLayer(marker2);

        map.removeLayer(line);

    },3000);
}

function showCombo(mult){

    const el =
    document.getElementById("comboEffect");

    el.innerText =
    "COMBO x" +
    mult.toFixed(1);

    el.style.opacity = 1;

    setTimeout(()=>{

        el.style.opacity = 0;

    },1200);
}

function showResult(distanceKm,points){

    document.getElementById("result")
    .style.display = "block";

    document.getElementById("distanceText")
    .innerText =
    "Distance: "
    +
    Math.round(distanceKm)
    +
    " km";

    document.getElementById("pointsText")
    .innerText =
    "Points: +"
    +
    points;
}

</script>

</body>
</html>

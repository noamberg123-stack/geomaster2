<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GEO ULTRA OMEGA</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<audio id="correctSound"
src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

<audio id="wrongSound"
src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
color:white;
font-family:Arial;
overflow:hidden;
}

#overlay{
position:absolute;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999999;
}

.title{
font-size:80px;
font-weight:bold;
color:#00ffcc;
text-shadow:0 0 30px #00ffcc;
margin-bottom:20px;
}

.subtitle{
color:#777;
font-size:22px;
margin-bottom:40px;
}

.play-btn{
background:#00ffcc;
color:black;
border:none;
padding:18px 45px;
border-radius:14px;
font-size:24px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.play-btn:hover{
transform:scale(1.05);
}

#topbar{
height:70px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:2px solid #222;
}

.logo{
font-size:28px;
font-weight:bold;
color:#00ffcc;
}

.stats{
display:flex;
gap:18px;
align-items:center;
}

.stat{
color:#888;
}

.value{
color:white;
font-weight:bold;
}

#game{
display:flex;
height:calc(100vh - 70px);
}

#satellite{
flex:1;
position:relative;
}

#map{
width:35%;
min-width:350px;
height:100%;
}

#timerBar{
position:absolute;
top:0;
left:0;
height:6px;
width:100%;
background:#00ffcc;
z-index:999;
}

#comboEffect{
position:absolute;
top:90px;
left:50%;
transform:translateX(-50%);
font-size:46px;
font-weight:bold;
color:gold;
opacity:0;
transition:0.3s;
z-index:999999;
pointer-events:none;
}

#achievement{
position:absolute;
top:20px;
right:20px;
background:#111;
border:2px solid gold;
padding:15px;
border-radius:12px;
display:none;
z-index:999999;
font-weight:bold;
}

#result{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
border:2px solid #00ffcc;
padding:30px;
border-radius:20px;
display:none;
z-index:999999;
width:360px;
text-align:center;
}

.next-btn{
margin-top:20px;
background:#00ffcc;
color:black;
border:none;
padding:12px 25px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

#gameOver{
position:absolute;
inset:0;
background:black;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999999;
}

#gameOver h1{
font-size:90px;
color:red;
margin-bottom:20px;
}

.power-buttons{
display:flex;
gap:10px;
}

.power-btn{
background:#222;
border:1px solid #00ffcc;
color:#00ffcc;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
}

.power-btn:hover{
background:#00ffcc;
color:black;
}

.rank-bronze{color:#cd7f32;}
.rank-silver{color:silver;}
.rank-gold{color:gold;}
.rank-diamond{color:#00ffff;}

@media(max-width:900px){

#game{
flex-direction:column;
}

#map{
width:100%;
height:40%;
}

#satellite{
height:60%;
}

.stats{
flex-wrap:wrap;
font-size:14px;
}

.title{
font-size:48px;
}

}

</style>
</head>

<body>

<div id="overlay">

<div class="title">
GEO ULTRA OMEGA
</div>

<div class="subtitle">
Ultimate Satellite Guessing Game
</div>

<button class="play-btn"
onclick="startGame()">

START GAME

</button>

</div>

<div id="comboEffect"></div>

<div id="achievement">
🏆 Achievement
</div>

<div id="topbar">

<div class="logo">
🌍 GEO ULTRA
</div>

<div class="stats">

<div class="stat">
Score:
<span class="value"
id="score">0</span>
</div>

<div class="stat">
Round:
<span class="value"
id="round">1</span>
</div>

<div class="stat">
Combo:
<span class="value"
id="combo">x1</span>
</div>

<div class="stat">
Lives:
<span class="value"
id="lives">3</span>
</div>

<div class="stat">
XP:
<span class="value"
id="xp">0</span>
</div>

<div class="stat">
Level:
<span class="value"
id="level">1</span>
</div>

<div class="stat">
Rank:
<span class="value rank-bronze"
id="rank">Bronze</span>
</div>

<div class="stat">
Time:
<span class="value"
id="timer">30</span>
</div>

</div>

<div class="power-buttons">

<button class="power-btn"
onclick="radarScan()">
RADAR
</button>

<button class="power-btn"
onclick="extraTime()">
+10 SEC
</button>

</div>

</div>

<div id="game">

<div id="satellite">

<div id="timerBar"></div>

</div>

<div id="map"></div>

</div>

<div id="result">

<h2>ROUND COMPLETE</h2>

<br>

<p id="distanceText"></p>

<br>

<p id="pointsText"></p>

<br>

<p id="ratingText"></p>

<button class="next-btn"
onclick="nextRound()">

NEXT ROUND

</button>

</div>

<div id="gameOver">

<h1>GAME OVER</h1>

<p style="font-size:32px;">
Final Score:
<span id="finalScore"></span>
</p>

<br>

<p style="font-size:24px;">
Highscore:
<span id="highscore"></span>
</p>

<br>

<button class="play-btn"
onclick="location.reload()">

PLAY AGAIN

</button>

</div>

<script>

const LOCATIONS = [

{name:"New York",lat:40.6892,lon:-74.0445},
{name:"Paris",lat:48.8584,lon:2.2945},
{name:"Tokyo",lat:35.6762,lon:139.6503},
{name:"Sydney",lat:-33.8568,lon:151.2153},
{name:"Dubai",lat:25.1972,lon:55.2744},
{name:"Rome",lat:41.8902,lon:12.4922},
{name:"London",lat:51.5074,lon:-0.1278},
{name:"Rio",lat:-22.9068,lon:-43.1729},
{name:"Jerusalem",lat:31.7683,lon:35.2137},
{name:"Cape Town",lat:-33.9249,lon:18.4241},
{name:"Bangkok",lat:13.7563,lon:100.5018},
{name:"Berlin",lat:52.5200,lon:13.4050},
{name:"Toronto",lat:43.6532,lon:-79.3832},
{name:"Singapore",lat:1.3521,lon:103.8198},
{name:"Iceland",lat:64.9631,lon:-19.0208}

];

let map;
let satellite;
let target;

let score = 0;
let round = 1;
let combo = 0;
let lives = 3;
let xp = 0;
let level = 1;
let rank = "Bronze";

let canGuess = true;

let timer;
let timeLeft = 30;

const scoreEl =
document.getElementById("score");

const roundEl =
document.getElementById("round");

const comboEl =
document.getElementById("combo");

const timerEl =
document.getElementById("timer");

function startGame(){

document.getElementById("overlay")
.style.display = "none";

const hs =
localStorage.getItem(
"geoUltraHighscore"
);

if(hs){

console.log(
"Highscore:",
hs
);

}

satellite =
L.map('satellite',
{
zoomControl:false
})
.setView([20,0],2);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
).addTo(satellite);

map =
L.map('map')
.setView([20,0],2);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

map.on('click',handleGuess);

nextRound();
}

function nextRound(){

document.getElementById("result")
.style.display = "none";

canGuess = true;

target =
LOCATIONS[
Math.floor(
Math.random()
*
LOCATIONS.length
)
];

satellite.setView(
[target.lat,target.lon],
15
);

resetTimer();
}

function resetTimer(){

clearInterval(timer);

timeLeft = 30;

timerEl.innerText = timeLeft;

const bar =
document.getElementById("timerBar");

bar.style.width = "100%";

timer =
setInterval(()=>{

timeLeft--;

timerEl.innerText = timeLeft;

bar.style.width =
(timeLeft/30)*100 + "%";

if(timeLeft <= 0){

clearInterval(timer);

loseLife();

showResult(20000,0);

canGuess = false;
}

},1000);
}

function distance(
lat1,
lon1,
lat2,
lon2
){

const R = 6371;

const dLat =
(lat2-lat1)
*
Math.PI/180;

const dLon =
(lon2-lon1)
*
Math.PI/180;

const a =

Math.sin(dLat/2)
*
Math.sin(dLat/2)

+

Math.cos(
lat1*Math.PI/180
)

*

Math.cos(
lat2*Math.PI/180
)

*

Math.sin(dLon/2)

*

Math.sin(dLon/2);

return R * 2 *

Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}

function handleGuess(e){

if(!canGuess) return;

canGuess = false;

clearInterval(timer);

const d = distance(
e.latlng.lat,
e.latlng.lng,
target.lat,
target.lon
);

const marker1 =
L.marker(e.latlng)
.addTo(map);

const marker2 =
L.marker(
[target.lat,target.lon]
)
.addTo(map);

const line =
L.polyline(
[
e.latlng,
[target.lat,target.lon]
],
{
color:'#00ffcc'
}
)
.addTo(map);

setTimeout(()=>{

map.removeLayer(marker1);

map.removeLayer(marker2);

map.removeLayer(line);

},3000);

if(d < 500){

combo++;

document
.getElementById("correctSound")
.play();

}else{

combo = 0;

loseLife();

document
.getElementById("wrongSound")
.play();
}

const multiplier =
1 + combo*0.5;

comboEl.innerText =
"x"
+
multiplier.toFixed(1);

if(combo >= 2){

showCombo(multiplier);
}

if(combo >= 5){

unlockAchievement(
"Combo Master"
);
}

const points =
Math.max(
0,
Math.round(
(10000 - d*5)
*
multiplier
)
);

score += points;

xp += points;

level =
Math.floor(xp/10000)
+1;

updateRank();

scoreEl.innerText = score;

round++;

roundEl.innerText = round;

document
.getElementById("xp")
.innerText = xp;

document
.getElementById("level")
.innerText = level;

localStorage.setItem(
"geoUltraHighscore",
score
);

if(score >= 50000){

unlockAchievement(
"World Explorer"
);
}

showResult(d,points);
}

function updateRank(){

const rankEl =
document.getElementById("rank");

if(score >= 100000){

rank = "Diamond";

rankEl.className =
"value rank-diamond";

}else if(score >= 50000){

rank = "Gold";

rankEl.className =
"value rank-gold";

}else if(score >= 20000){

rank = "Silver";

rankEl.className =
"value rank-silver";

}else{

rank = "Bronze";

rankEl.className =
"value rank-bronze";
}

rankEl.innerText = rank;
}

function showCombo(mult){

const el =
document.getElementById(
"comboEffect"
);

el.innerText =
"COMBO x"
+
mult.toFixed(1);

el.style.opacity = 1;

setTimeout(()=>{

el.style.opacity = 0;

},1200);

}

function showResult(
distanceKm,
points
){

document.getElementById("result")
.style.display = "block";

document.getElementById(
"distanceText"
)
.innerText =
"Distance: "
+
Math.round(distanceKm)
+
" km";

document.getElementById(
"pointsText"
)
.innerText =
"Points: +"
+
points;

let rating = "BAD";

if(distanceKm < 100){

rating = "PERFECT";

}else if(distanceKm < 500){

rating = "AMAZING";

}else if(distanceKm < 1500){

rating = "GOOD";
}

document.getElementById(
"ratingText"
)
.innerText =
"Rating: "
+
rating;

}

function radarScan(){

L.circle(
[target.lat,target.lon],
{
radius:400000,
color:'yellow'
}
)
.addTo(map);

}

function extraTime(){

timeLeft += 10;

timerEl.innerText = timeLeft;

}

function loseLife(){

lives--;

document
.getElementById("lives")
.innerText = lives;

if(lives <= 0){

document
.getElementById("finalScore")
.innerText = score;

document
.getElementById("highscore")
.innerText =
localStorage.getItem(
"geoUltraHighscore"
) || 0;

document
.getElementById("gameOver")
.style.display = "flex";

}

}

function unlockAchievement(text){

const el =
document.getElementById(
"achievement"
);

el.innerText =
"🏆 "
+
text;

el.style.display = "block";

setTimeout(()=>{

el.style.display = "none";

},2500);

}

</script>

</body>
</html>

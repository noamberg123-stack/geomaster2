<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GEO ULTRA PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:Arial;background:#000;color:#0ff;overflow:hidden}
#ui{position:absolute;top:0;left:0;right:0;height:60px;background:#111;display:flex;justify-content:space-between;align-items:center;padding:0 15px}
#game{display:flex;height:100vh;padding-top:60px}
#view{flex:1}
#map{width:35%}
.panel{position:absolute;right:10px;top:70px;background:#111;padding:10px;border:1px solid #0ff}
button{background:#0ff;border:none;padding:8px;cursor:pointer}
</style>

</head>

<body>

<div id="ui">
<div>🌍 GEO PRO MAX</div>
<div id="stats">Score: 0 | ELO: 1000 | Room: SOLO</div>
</div>

<div id="game">
<div id="view"></div>
<div id="map"></div>
</div>

<div class="panel">
<button onclick="createRoom()">Create Room</button>
<button onclick="joinRoom()">Join Room</button>
<button onclick="daily()">Daily Challenge</button>
</div>

<script>

const SUPABASE_URL = "https://ptairxnfkdemqkfttjuk.supabase.co";
const SUPABASE_KEY = "YOUR_KEY_HERE";
const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// ---------------- GAME STATE ----------------
let score=0;
let elo=1000;
let room="SOLO";
let target={lat:0,lng:0};

// ---------------- STREET VIEW ----------------
let panorama;

function loadStreet(lat,lng){
if(window.google){
panorama = new google.maps.StreetViewPanorama(
document.getElementById("view"),
{
position:{lat,lng},
pov:{heading:0,pitch:0},
zoom:1
});
}
}

// fallback
function loadFallback(){
document.getElementById("view").innerHTML =
"<h2 style='padding:20px'>Street View unavailable</h2>";
}

// ---------------- GAME ----------------
function newRound(){
target = {
lat:(Math.random()*180-90),
lng:(Math.random()*360-180)
};

loadStreet(target.lat,target.lng);
}

// ---------------- GUESS ----------------
function guess(lat,lng){

const d = Math.sqrt(
Math.pow(lat-target.lat,2)+
Math.pow(lng-target.lng,2)
);

const points = Math.max(0,10000 - d*100);

score += points;

// ELO system
if(points > 5000) elo += 25;
else elo -= 10;

updateUI();
newRound();

}

// ---------------- DAILY CHALLENGE ----------------
function daily(){
const seed = new Date().toDateString();
let hash = 0;
for(let i=0;i<seed.length;i++) hash += seed.charCodeAt(i);

Math.random = mulberry32(hash);

room="DAILY";
newRound();
}

function mulberry32(a){
return function(){
let t = a += 0x6D2B79F5;
t = Math.imul(t ^ t >>> 15, t | 1);
t ^= t + Math.imul(t ^ t >>> 7, t | 61);
return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
}

// ---------------- MULTIPLAYER ----------------
async function createRoom(){
room = Math.random().toString(36).substring(2,7);

await db.from("rooms").insert({
room,
score:0
});

updateUI();
}

function joinRoom(){
room = prompt("Room code:");
updateUI();
}

// ---------------- LEADERBOARD ----------------
async function saveScore(){
await db.from("scores").insert({
score,
elo,
room
});
}

// ---------------- UI ----------------
function updateUI(){
document.getElementById("stats").innerText =
`Score: ${score} | ELO: ${elo} | Room: ${room}`;
}

// ---------------- INIT ----------------
function start(){
newRound();
updateUI();
}

start();

</script>

</body>
</html>

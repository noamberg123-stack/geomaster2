<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRO GEO REAL FINAL</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial;
background:#000;
color:white;
}

#top{
height:55px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
background:#111;
border-bottom:2px solid #0ff;
}

#game{
position:relative;
height:calc(100vh - 55px);
}

#image{
position:absolute;
inset:0;
background:#000;
}

#image img{
width:100%;
height:100%;
object-fit:cover;
}

#mapWrap{
position:absolute;
top:10px;
right:10px;
width:320px;
height:220px;
border:2px solid #0ff;
background:#111;
display:none;
z-index:10;
}

#map{
width:100%;
height:100%;
}

#result{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:15px;
border:2px solid #0ff;
display:none;
text-align:center;
z-index:20;
}

button{
background:#0ff;
border:none;
padding:8px;
margin-top:8px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div id="top">
<div>🌍 PRO GEO REAL FINAL</div>
<div id="stats">Loading...</div>
</div>

<div id="game">

<div id="image">Loading...</div>

<div id="mapWrap">
<div id="map"></div>
</div>

<div id="result">
<div id="info"></div>
<button onclick="next()">NEXT</button>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let marker;
let target;
let score=0;
let round=0;

const LOCS=[
{lat:48.85,lng:2.35,name:"Paris"},
{lat:40.71,lng:-74,name:"New York"},
{lat:35.68,lng:139.69,name:"Tokyo"},
{lat:31.77,lng:35.21,name:"Jerusalem"},
{lat:-33.86,lng:151.21,name:"Sydney"},
{lat:25.20,lng:55.27,name:"Dubai"}
];

document.addEventListener("DOMContentLoaded",()=>{

// 🗺️ MAP FIX (no black screen)
map=L.map("map").setView([20,0],2);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
attribution:""
}).addTo(map);

map.on("click",guess);

newRound();
});

function newRound(){
round++;

target=LOCS[Math.floor(Math.random()*LOCS.length)];

// 📸 guaranteed image (NO black screen)
loadImage(target.name);

// reset map view
if(map){
map.setView([20,0],2);
}

updateTop("???");
}

function loadImage(name){

let fallback=`https://source.unsplash.com/1600x900/?street,city,${name}`;

// Wikipedia try first
fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${name}`)
.then(r=>r.json())
.then(data=>{

let img=data?.thumbnail?.source || fallback;

document.getElementById("image").innerHTML=
`<img src="${img}" onerror="this.src='${fallback}'"/>`;

})
.catch(()=>{

document.getElementById("image").innerHTML=
`<img src="${fallback}"/>`;

});
}

function guess(e){

if(marker) map.removeLayer(marker);

marker=L.marker([e.latlng.lat,e.latlng.lng]).addTo(map);

let d=distance(
e.latlng.lat,
e.latlng.lng,
target.lat,
target.lng
);

let pts=Math.max(0,Math.round(10000-d*10));
score+=pts;

// show map
document.getElementById("mapWrap").style.display="block";
map.invalidateSize();

L.marker([target.lat,target.lng]).addTo(map);
map.setView([target.lat,target.lng],3);

document.getElementById("result").style.display="block";
document.getElementById("info").innerHTML=
`<h3>${target.name}</h3>
<p>Distance: ${Math.round(d)} km</p>
<p>Points: ${pts}</p>`;

updateTop(target.name);
}

function next(){
document.getElementById("result").style.display="none";
document.getElementById("mapWrap").style.display="none";
newRound();
}

function distance(a,b,c,d){
const R=6371;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;

const x=
Math.sin(dLat/2)**2+
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function updateTop(loc){
document.getElementById("stats").innerText=
`Score: ${score} | Round: ${round} | Location: ${loc}`;
}

</script>

</body>
</html>

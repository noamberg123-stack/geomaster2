<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoGuessr PRO FREE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial;
}

#top{
height:60px;
background:#111;
color:#0ff;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
}

#game{
display:flex;
height:calc(100vh - 60px);
}

#sat{
flex:1;
height:100%;
}

#map{
width:35%;
height:100%;
}

#leader{
position:absolute;
top:70px;
left:10px;
background:#111;
border:1px solid #0ff;
padding:10px;
width:200px;
color:white;
font-size:14px;
}

button{
background:#0ff;
border:none;
padding:6px;
margin-top:5px;
cursor:pointer;
width:100%;
}

</style>
</head>

<body>

<div id="top">
<div>🌍 GEO PRO FREE</div>
<div id="stats">Score: 0</div>
</div>

<div id="leader">
<b>Leaderboard</b>
<div id="lb">loading...</div>
<button onclick="daily()">Daily</button>
</div>

<div id="game">
<div id="sat"></div>
<div id="map"></div>
</div>

<script>

// ---------------- SUPABASE ----------------
const supabase = window.supabase.createClient(
"https://ptairxnfkdemqkfttjuk.supabase.co",
"YOUR_ANON_KEY_HERE"
);

// ---------------- GAME ----------------
let score = 0;
let target;

let sat = L.map('sat');
let map = L.map('map');

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
).addTo(sat);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

map.on("click", guess);

// ---------------- LOCATIONS ----------------
const LOCS = [
{lat:48.85,lng:2.35},
{lat:40.71,lng:-74.00},
{lat:35.68,lng:139.69},
{lat:31.77,lng:35.21},
{lat:-33.86,lng:151.21},
{lat:25.20,lng:55.27}
];

// ---------------- GAME ----------------
function newRound(){
target = LOCS[Math.floor(Math.random()*LOCS.length)];

sat.setView([target.lat,target.lng],3);

setTimeout(() => {
sat.invalidateSize();
map.invalidateSize();
}, 200);
}

// ---------------- GUESS ----------------
function guess(e){

let d = distance(
e.latlng.lat,
e.latlng.lng,
target.lat,
target.lng
);

let points = Math.max(0,10000 - d*10);

score += points;

document.getElementById("stats").innerText =
"Score: " + score;

saveScore();

newRound();

}

// ---------------- DISTANCE ----------------
function distance(lat1,lon1,lat2,lon2){
const R=6371;
const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ---------------- DAILY ----------------
function daily(){
let seed = new Date().toDateString();
let h = 0;

for(let i=0;i<seed.length;i++)
h += seed.charCodeAt(i);

Math.random = mulberry(h);

newRound();
}

function mulberry(a){
return function(){
a |= 0;
a = a + 0x6D2B79F5 | 0;

let t = Math.imul(a ^ a >>> 15, 1 | a);
t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
}

// ---------------- SUPABASE ----------------
async function saveScore(){
await supabase.from("scores").insert({
score:score
});

loadLB();
}

async function loadLB(){

let {data} =
await supabase
.from("scores")
.select("*")
.order("score",{ascending:false})
.limit(5);

if(!data) return;

document.getElementById("lb").innerHTML =
data.map((x,i)=>
`${i+1}. ${x.score}`
).join("<br>");

}

// ---------------- START ----------------
setTimeout(() => {
sat.setView([20,0],2);
map.setView([20,0],2);
newRound();
loadLB();
}, 300);

setInterval(loadLB,5000);

</script>

</body>
</html>
